[package]
name = "wasmtime-oc"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasmtime = { path = "../crates/wasmtime", features = [
    "runtime", "cranelift", "pulley", "cache", "wat"
] }
pulley-interpreter = { path = "../pulley" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0.0-rc.3", features = ["derive", "serde"] }
lz4_flex = "0.11"
sha2 = "0.10"
